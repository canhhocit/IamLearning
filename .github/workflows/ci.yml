name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            PlayWright-e2e/package-lock.json

      - name: Create local env files from examples
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
          cp PlayWright-e2e/.env.example PlayWright-e2e/.env

      - name: Start Kafka and PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 kafka postgres

      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Playwright end-to-end tests
        working-directory: PlayWright-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: PlayWright-e2e/test-results/
          if-no-files-found: ignore

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
